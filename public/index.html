<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Search</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>JobPilot </h1>
        <p><i>One flight across LinkedIn, Indeed, Glassdoor and more, straight to your dream job.</i></p>
    </header>
    <main>

        <form id="search-form">
            <label for="search-input">Job title or keyword</label>
            <input id="search-input" type="text" placeholder="e.g. software engineer">
            
            <select id = "country">
                <option value ="us">United States</option>
                <option value="gb">United Kingdom</option>
                <option value="rw">Rwanda</option>
                <option value="ke">Kenya</option>
                <option value="ng">Nigeria</option>
                <option value="za">South Africa</option>
            </select>

            <select id="date-posted">
                <option value="all">Any time</option>
                <option value="today">Today</option>
                <option value="3days">Last 3 days</option>
                <option value="week">This week</option>
                <option value="month">This month</option>
            </select>
        <label><input type="checkbox" id="remote"> Remote only</label>

            

            <fieldset>
                <legend>Job type</legend>
                <label><input type="checkbox" name="types" value="FULLTIME">Full-Time</label>
                <label><input type="checkbox" name="types" value="PARTTIME">Part-time</label>
                <label><input type="checkbox" name="types" value="CONTRACTOR"> Contract</label>
                <label><input type="checkbox" name="types" value="INTERN">Internship</label>
            </fieldset>
            <button type="submit">Search</button>

        </form>
        <p id="status"></p>
        <label for="sort">Sort by</label>
        <select id="sort">
            <option value="relevance">Best match</option>
            <option value="newest">Newest first</option>
            <option value="salary">Highest salary</option>
            <option value="company">Company A-Z</option>
        </select>
<label for ="currency">Show salary in</label>
<select id="currency">
    <option value="USD">US dollar (USD)</option>
    <option value="RWF">Rwandan franc (RWF)</option>
    <option value="KES">Kenyan shilling(KES)</option>
    <option value="NGN">Nigerian naira (NGN)</option>
    <option value="ZAR">South African rand (ZAR)</option>
    <option value="GBP">British pound (GBP)</option>
    <option value="EUR">Euro (EUR)</option>
</select>



        <ul id="job-list"></ul>


<section id="tracker">

    <h2>My applications</h2>
    <label for="status-filter">Show</label>
    <select id="status-filter">
        <option value="All">ALL</option>
        <option value="Saved">Saved</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>

    </select>
    <ul id="tracker-list"></ul>
</section>

    </main>
    <footer>
        <P><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer" >Rates by Exchange Rate API </a></P>
        <p>Job data from the JSearch API by OpenWeb Ninja on RapidAPI.</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
